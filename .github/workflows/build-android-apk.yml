name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/PlotWatchAndroid/**'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: android/PlotWatchAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PakistanPlotWatch-APK
          path: android/PlotWatchAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
