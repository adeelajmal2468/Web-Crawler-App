plugins { id 'com.android.application' }
android {
    namespace 'pk.plotwatch.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'pk.plotwatch.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
